<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex" />
    <title>Finishing sign-in — ctbx</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font:
          15px/1.5 ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        background: #fff;
        color: #16181d;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #14161a;
          color: #f2f3f5;
        }
      }
      main {
        text-align: center;
        padding: 2rem;
        max-width: 32rem;
      }
      p {
        color: #6b7280;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Finishing sign-in…</h1>
      <p id="status">You can close this window if it does not close itself.</p>
    </main>

    <!--
      Static OAuth landing page (tasks/spec.md §7.5).

      This is a real file rather than an app route because GitHub Pages has no
      SPA fallback and would 404 on a virtual path — and because the redirect
      must work even when the app is not loaded.

      It deliberately does nothing but hand the query string back to the app.
      All validation (state, RFC 9207 iss, expiry) happens in the app, which is
      the only place that holds the PKCE verifier and the expected issuer.
    -->
    <script>
      (function () {
        var MESSAGE_TYPE = 'ctbx:oauth-callback';
        var REDIRECT_RESULT_KEY = 'ctbx:oauth-redirect-result';
        var search = window.location.search;

        var params = {};
        var query = new URLSearchParams(search);
        ['code', 'state', 'iss', 'error', 'error_description'].forEach(function (key) {
          params[key] = query.get(key);
        });

        // Popup path: hand the result to the opener on its own origin only.
        if (window.opener && window.opener !== window) {
          try {
            window.opener.postMessage(
              { type: MESSAGE_TYPE, params: params },
              window.location.origin
            );
            window.close();
            return;
          } catch (error) {
            /* fall through to the redirect path */
          }
        }

        // Redirect path: stash the raw query string and return to the app.
        try {
          sessionStorage.setItem(REDIRECT_RESULT_KEY, JSON.stringify({ search: search }));
        } catch (error) {
          document.getElementById('status').textContent =
            'Could not return the sign-in result to the app. Session storage is unavailable.';
          return;
        }

        // ../ climbs out of /oauth/ back to the app root.
        window.location.replace(new URL('../', window.location.href).href);
      })();
    </script>
  </body>
</html>
